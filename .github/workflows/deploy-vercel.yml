name: Deploy to Vercel

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify production build
        run: npm run build

      - name: Install Vercel CLI
        run: npm install --global vercel@60.1.3

      - name: Link dedicated Vercel project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          rm -rf .vercel
          vercel link --yes --scope="carlos-lopez" --project="candida-alberto-2026" --token="$VERCEL_TOKEN"

      - name: Deploy production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel deploy --prod --yes --token="$VERCEL_TOKEN"

      - name: Verify deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel project inspect --non-interactive --token="$VERCEL_TOKEN"

      - name: Smoke test production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          body=$(curl -fsSL https://candida-alberto-2026-alpha.vercel.app/)
          echo "$body"
          echo "$body" | grep -q "CÁNDIDA"
          echo "$body" | grep -q "ALBERTO"
          echo "$body" | grep -q "OCTUBRE"
          echo "$body" | grep -q "2026"
