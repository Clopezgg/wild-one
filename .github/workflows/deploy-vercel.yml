name: Deploy to Vercel

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify local production build
        run: npm run build

      - name: Install Vercel CLI
        run: npm install --global vercel@60.1.3

      - name: Deploy production and capture URL
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set +e
          vercel deploy --prod --yes --token="$VERCEL_TOKEN" 2>&1 | tee vercel-deploy.log
          status=${PIPESTATUS[0]}
          url=$(grep -Eo 'https://[^[:space:]]+\.vercel\.app' vercel-deploy.log | tail -1 | sed 's/[),]$//')
          echo "url=$url" >> "$GITHUB_OUTPUT"
          exit $status

      - name: Inspect Vercel deployment logs
        if: always()
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: |
          if [ -n "$DEPLOY_URL" ]; then
            vercel inspect "$DEPLOY_URL" --logs --token="$VERCEL_TOKEN" || true
          else
            echo "No deployment URL was captured."
          fi
