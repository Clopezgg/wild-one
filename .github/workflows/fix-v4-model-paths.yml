name: Fix V4 model paths

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use absolute self-hosted model URLs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('public/v4/index.html')
          s=p.read_text()
          s=s.replace("const KENNEY='/v4/models/';", "const KENNEY='https://raw.githubusercontent.com/Clopezgg/wild-one/main/public/v4/models/';")
          s=s.replace("const HORSE='/v4/models/Horse.glb';", "const HORSE='https://raw.githubusercontent.com/Clopezgg/wild-one/main/public/v4/models/Horse.glb';")
          p.write_text(s)
          PY
      - name: Commit path fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/v4/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: use self-hosted absolute V4 model URLs"
          git push
